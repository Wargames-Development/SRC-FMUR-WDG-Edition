gradle.projectsEvaluated {
    def root = gradle.rootProject
    def output = root.file("${root.buildDir}/mg36-check/classes")
    def compileTool = root.task('compileMG36GeometryTool', type: JavaCompile) {
        source = root.fileTree('tools/mg36') { include '*.java' }
        classpath = root.sourceSets.main.runtimeClasspath
        destinationDir = output
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
        options.encoding = 'UTF-8'
    }
    root.task('checkMG36Geometry', type: JavaExec,
            dependsOn: [root.tasks.compileJava, compileTool]) {
        classpath = root.files(output) + root.sourceSets.main.runtimeClasspath
        main = 'MG36GeometryCheck'
        args root.file("${root.buildDir}/mg36-check").absolutePath
    }
}

